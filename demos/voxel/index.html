<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Editor | Hand Tracking</title>
    <link rel="stylesheet" href="styles.css">
    <!-- MediaPipe dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <!-- Three.js dependencies -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>
    <div id="ui-container">
        <div class="hud-top-left">
            <div class="status-badge">
                <span class="pulse-icon"></span>
                <span id="status-text">INITIALIZING...</span>
            </div>
            <div class="stats">
                <p>BLOCKS: <span id="block-count">0</span></p>
                <p>MODE: <span id="current-mode">BUILDING</span></p>
            </div>
        </div>
        <div class="instructions">
            <p>Right Hand → <b>Build / Remove (Pinch)</b></p>
            <p>Left Hand → <b>Rotate Scene (Move)</b></p>
            <p>'C' Key → <b>Clear Scene</b></p>
        </div>



    </div>

    <!-- autoplay + muted: some browsers refuse to start a video element that
         has neither, even for a MediaStream, leaving a black screen. -->
    <video id="input-video" playsinline autoplay muted></video>
    <canvas id="output-canvas"></canvas>

    <script type="module" src="main.js"></script>
</body>

</html>
